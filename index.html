<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar Turno</title>

  <!-- =========================
       ESTILOS Y LIBRERÍAS
  ========================== -->
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />

  <!-- =========================
       LIBRERÍAS JS
  ========================== -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- Tu script principal -->
  <script defer src="./js/main.js"></script>
</head>

<body>
  <header>
    <h1 class="confirmar-titulo">Registro de Paciente</h1>
    <h2>Complete sus datos personales para solicitar un turno médico</h2>
  </header>  <main class="formulario">


    <form id="form-confirmar">
      <label>Nombre y Apellido:</label>
      <input type="text" id="nombre" autocomplete="name" required />

      <label>Email:</label>
      <input type="email" id="email" autocomplete="email" required />

      <label>Teléfono:</label>
      <input type="tel" id="telefono" inputmode="numeric" maxlength="15" required />

      <label for="tieneObraSocial">¿Tiene obra social?</label>
      <select id="tieneObraSocial" required>
        <option value="">Seleccione una opción</option>
        <option value="si">Sí</option>
        <option value="no">No</option>
      </select>

      <!-- Este campo se muestra solo si elige “Sí” -->
      <div id="campoObraSocial" style="display: none;">
        <label for="obraSocial">¿Cuál?</label>
        <input type="text" id="obraSocial" />
      </div>

      <button type="submit">Guardar datos</button>
    </form>

   <div class="enlace-turnos">
  <a href="./pages/misturnos.html" class="btn-turnos">Ver Mis Turnos</a>
</div>
  </main>
</body>
</html>
